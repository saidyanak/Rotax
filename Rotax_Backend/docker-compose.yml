services:
  # Spring Boot Backend Servisi
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotax_backend
    ports:
      - "8080:8080"
    volumes:
      # Hot reload için kaynak kodları mount et
      - ./src:/app/src
      # Target klasörünü container'da tut
      - /app/target
      # Maven cache'i host ile paylaş (hızlı build)
      - ~/.m2:/root/.m2
      # Upload klasörü
      - ./uploads:/app/uploads
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - rotax-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: rotax_postgres
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - rotax-db-data:/var/lib/postgresql/data
    networks:
      - rotax-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rotax}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  rotax-db-data:
    driver: local

networks:
  rotax-network:
    driver: bridge